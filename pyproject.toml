[project]
name = "quorum"
version = "0.1.0"
description = "Event study of clustered insider buying in SEC Form 4 filings, before and after 2012."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy==2.3.4",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "matplotlib==3.10.7",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.5",
    "mypy==1.18.2",
    "pandas-stubs==2.3.2.250926",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quorum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "pyarrow.*"]
ignore_missing_imports = true
